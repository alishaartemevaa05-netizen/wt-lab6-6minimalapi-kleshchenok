<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Swagger UI — AutoRent API</title>
  <link rel="icon" href="/img/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5.17.14/swagger-ui.css">
  <style>body{margin:0}.topbar-back{padding:12px 24px;background:#0d1424;font:600 15px system-ui,sans-serif}.topbar-back a{color:#22d3ee;text-decoration:none}</style>
</head>
<body>
  <div class="topbar-back"><a href="/">← На главную AutoRent</a></div>
  <div id="swagger-ui"></div>
  <!-- Swagger UI подключается с CDN: никаких NuGet-пакетов не нужно.
       Он читает OpenAPI-документ, который отдаёт само приложение (/openapi/v1.json). -->
  <script src="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5.17.14/swagger-ui-bundle.js"></script>
  <script>
    window.ui = SwaggerUIBundle({ url: "/openapi/v1.json", dom_id: "#swagger-ui", deepLinking: true });
  </script>
</body>
</html>
